[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the "created date" comment in generated revision files.
timezone = UTC

# Max length of the slug portion of a generated revision filename.
truncate_slug_length = 40

# Placeholder only — app/db/base.py and alembic/env.py both read the real DSN from the
# DATABASE_URL environment variable at runtime. See application/backend/.env.example.
sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/marketing_in_a_box

[post_write_hooks]
# No post-write formatting hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
